<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 444" role="img" aria-labelledby="title desc" lang="ja">
  <title id="title">リポジトリ変更のレビュー経路</title>
  <desc id="desc">手動デモは手元での検査結果を返す。承認済みLinux経路では独立検証を経て、候補をPRと人のレビューへ渡す。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#496879"/></marker></defs>
  <rect width="820" height="444" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, 'Segoe UI', 'Yu Gothic', Meiryo, sans-serif" text-anchor="middle">
    <text x="410" y="32" fill="#18364b" font-size="22" font-weight="700">リポジトリ変更のレビュー経路</text>
    <path data-from="task" data-to="manual" d="M410 121 V136 H215 V151" fill="none" stroke="#496879" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path data-from="task" data-to="linux" d="M410 121 V136 H605 V151" fill="none" stroke="#496879" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path data-from="manual" data-to="report" d="M215 219 V249" fill="none" stroke="#496879" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path data-from="linux" data-to="verify" d="M605 219 V249" fill="none" stroke="#496879" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path data-from="verify" data-to="pr" d="M605 317 V351" fill="none" stroke="#496879" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path data-from="pr" data-to="human" d="M440 386 H382" fill="none" stroke="#496879" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <g id="task">
      <rect x="245" y="55" width="330" height="66" rx="9" fill="#153149" stroke="#78909c" stroke-width="1"/>
      <text x="410" y="82" font-size="19" font-weight="650" fill="#ffffff">制御プレーン</text>
      <text x="410" y="105" font-size="15" fill="#d1e4ee">タスクの範囲・ポリシー・台帳・承認</text>
    </g>
    <g id="manual">
      <rect x="50" y="153" width="330" height="66" rx="9" fill="#edf2f6" stroke="#78909c" stroke-width="1"/>
      <text x="215" y="180" font-size="19" font-weight="650" fill="#233848">信頼済みの編集</text>
      <text x="215" y="203" font-size="15" fill="#425a6c">ManualAdapter・ホスト上の作業コピー</text>
    </g>
    <g id="linux">
      <rect x="440" y="153" width="330" height="66" rx="9" fill="#e6f4ef" stroke="#78909c" stroke-width="1"/>
      <text x="605" y="180" font-size="19" font-weight="650" fill="#13483c">承認した作業を実行</text>
      <text x="605" y="203" font-size="15" fill="#356456">オフラインの Linux コンテナ</text>
    </g>
    <g id="report">
      <rect x="50" y="251" width="330" height="66" rx="9" fill="#edf2f6" stroke="#78909c" stroke-width="1"/>
      <text x="215" y="278" font-size="19" font-weight="650" fill="#233848">ローカル検査結果</text>
      <text x="215" y="301" font-size="15" fill="#425a6c">手動デモはここで終了</text>
    </g>
    <g id="verify">
      <rect x="440" y="251" width="330" height="66" rx="9" fill="#e6f4ef" stroke="#78909c" stroke-width="1"/>
      <text x="605" y="278" font-size="19" font-weight="650" fill="#13483c">成果物の回収と独立検証</text>
      <text x="605" y="301" font-size="15" fill="#356456">検証器が候補を照合</text>
    </g>
    <g id="pr">
      <rect x="440" y="353" width="330" height="66" rx="9" fill="#e6f4ef" stroke="#78909c" stroke-width="1"/>
      <text x="605" y="380" font-size="19" font-weight="650" fill="#13483c">候補のプルリクエスト</text>
      <text x="605" y="403" font-size="15" fill="#356456">リポジトリの CI 検査</text>
    </g>
    <g id="human">
      <rect x="50" y="353" width="330" height="66" rx="9" fill="#fff1d6" stroke="#78909c" stroke-width="1"/>
      <text x="215" y="380" font-size="19" font-weight="650" fill="#523810">人による判断</text>
      <text x="215" y="403" font-size="15" fill="#705524">レビューと main へのマージ</text>
    </g>
  </g>
</svg>
